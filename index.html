<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DS App</title>
</head>
<body>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz5o2rab_Npk8KMu7zldYrHuhsmWc3ZQiQPe1GkXOs-26pBMPo6QdqNNJWaBvcNCYDI4Q/exec';
fetch(SCRIPT_URL, { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(html => { document.open(); document.write(html); document.close(); })
  .catch(e => { document.body.innerHTML = '<p>Không tải được app: ' + e.message + '</p>'; });
</script>
</body>
</html>
