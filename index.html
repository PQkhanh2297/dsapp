<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đồ Hiệu Tử Tế - Quản lý phiếu</title>
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--line:#2a2f3a;--txt:#eef1f6;--mute:#8b93a4;--blue:#2d7ff9;--green:#22c55e;--red:#ef4444;--amber:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:70px;font-size:15px}
  header{position:sticky;top:var(--tbh,0px);background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;font-weight:700;z-index:5;display:flex;justify-content:space-between;align-items:center}
  main{padding:14px;max-width:760px;margin:0 auto}
  h2{font-size:18px;margin:4px 0 12px}
  h3{font-size:14px;color:var(--mute);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.5px}
  label{display:block;font-size:13px;color:var(--mute);margin:10px 0}
  input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0c0e12;color:var(--txt);font-size:16px;margin-top:4px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:#262b36;color:var(--txt);cursor:pointer}
  button.primary{background:var(--blue);color:#fff;width:100%;padding:14px;font-weight:600;margin-top:14px}
  button.ok{background:var(--green);color:#052;font-weight:600}
  button.cash{background:var(--amber);color:#331;font-weight:600}
  button.bad{background:#3a1717;color:#fca5a5}
  button.sm{padding:6px 10px;font-size:13px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .seg{display:flex;gap:6px;margin:6px 0}
  .seg button{flex:1}
  .seg button.on{background:var(--blue);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:6px;cursor:pointer}
  .card .top{display:flex;justify-content:space-between;gap:8px}
  .mute{color:var(--mute);font-size:13px}
  .tag{display:inline-block;font-size:12px;padding:3px 8px;border-radius:999px;background:#262b36}
  .tag.paid{background:#123d24;color:#86efac}
  .tag.unpaid{background:#3d2a12;color:#fcd34d}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .itm{border-bottom:1px solid var(--line);padding:4px 0}
  .nvpick{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px}
  .nvpick .chip{padding:4px 9px;font-size:12px}
  .dvr.on{background:#132a1c;border-left:3px solid var(--green)}
  .dvr .ck{color:var(--green)}
  .dvl .nvtag{color:var(--mute);font-size:11px;margin-left:6px}
  .chip{background:#22262f;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:13px;cursor:pointer}
  .items .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .it input{width:130px;padding:8px;margin:0}
  .imgs img{width:110px;height:140px;object-fit:cover;border-radius:10px;margin:6px 6px 0 0;border:1px solid var(--line)}
  .total{font-size:18px;font-weight:700;text-align:right;margin:12px 0}
  nav{position:fixed;bottom:0;left:0;right:0;background:#0b0d11;border-top:1px solid var(--line);display:flex;z-index:6}
  nav button{flex:1;border-radius:0;background:none;padding:10px 2px;font-size:12px;color:var(--mute)}
  nav button.on{color:var(--blue);font-weight:600}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .sheet.show{display:flex}
  .sheet .box{background:var(--card);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0}
  .stat b{font-size:20px;display:block;margin-top:2px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  pre{white-space:pre-wrap;background:#0c0e12;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;font-family:inherit}
  .empty{text-align:center;color:var(--mute);padding:30px 0}
  .bill{font-family:Arial,sans-serif;font-size:13px;color:#000}
  .bill h1{font-size:17px;text-align:center;margin:8px 0}
  .bill table{width:100%;border-collapse:collapse;margin-top:6px}
  .bill td,.bill th{padding:4px 0;text-align:left;vertical-align:top;color:#000}
  .bill hr{border:0;border-top:1px dashed #000;margin:8px 0}
  .bc{text-align:center} .br{text-align:right} .bb{font-weight:bold}
  @media print{
    body *{visibility:hidden}
    #billArea,#billArea *{visibility:visible}
    #billArea{display:block!important;position:absolute;left:0;top:0;width:80mm;background:#fff;padding:0}
    #sheet{position:static!important;background:none!important}
    #sheet .box{max-height:none!important;overflow:visible!important;background:#fff!important;padding:0!important;max-width:none!important}
  }
  #billArea{display:none}
  .kh-card{padding:5px 7px;margin-bottom:3px;line-height:1.2}
  .kh-card b{font-size:13px}
  .kh-card .mute{font-size:11px}
  .kh-card button.sm{padding:3px 7px;font-size:11px}
  .kh-card .phr{gap:6px!important}
  .kh-card .phr{margin-top:4px!important}
  .tbw{overflow-x:auto}
  .tb{width:100%;border-collapse:collapse;font-size:12px;line-height:1.25}
  .tb th{font-size:11px;color:var(--mute);font-weight:600;text-align:left;padding:4px;border:1px solid #4a5263;background:#141821;white-space:nowrap}
  .tb td{padding:4px;border:1px solid #4a5263;vertical-align:middle}
  .tb tr.khr td{border-top:3px solid #6b7385}
  .tb td.anh{width:150px;padding:3px}
  .anhs{display:flex;gap:3px}
  .anhs.one img{height:96px;width:100%}
  .anhs img{flex:1;min-width:0;width:0;height:50px;object-fit:cover;border-radius:4px;border:1px solid var(--line);display:block}
  .tb .ph{font-size:14px;font-weight:700;color:var(--txt)}
  .tb tr{cursor:pointer}
  .tb tr.khr td{background:#161a22}
  .tb .tag{font-size:10px;padding:1px 6px}
  .tb button.sm{padding:3px 6px;font-size:11px}
  .dvl{display:flex;justify-content:space-between;gap:8px;font-size:12px}
  .dvl span:last-child{white-space:nowrap;font-weight:600}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:0 12px}
  .sec>summary{padding:12px 0;font-weight:700;cursor:pointer;list-style:none}
  .sec[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
  .hotgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 10px}
  .hotb{background:#22262f;border:1px solid var(--line);border-radius:10px;padding:10px 9px;text-align:left;font-size:13px;color:inherit;cursor:pointer;min-height:58px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
  .hotb.on{border-color:var(--green);background:#132a1c}
  .hotb b{font-size:13px;color:var(--gold,#f5c542)}
  .hotb .hn{font-size:14px;line-height:1.25}
  .hf{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
  .dvp{width:96px!important;background:transparent!important;border:none!important;border-bottom:1px dashed var(--line)!important;color:#f5c542!important;font-weight:700;padding:2px 0!important;text-align:right;font-size:14px}
  .stp{display:inline-flex;align-items:center;gap:6px}
  .stp button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#2a303c;color:inherit;font-size:18px;padding:0;line-height:1}
  .stp b{min-width:18px;text-align:center}
  .eit{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
  .eit .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pinbar{background:#1a1f29;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0}
  .gcn{margin-top:6px;background:#3a2e10;color:#fcd34d;border:1px solid #6b5416;border-radius:8px;padding:4px 7px;font-size:13px;font-weight:600;display:inline-block;max-width:100%;white-space:normal}
  .gcbox input{background:#2a2410!important;border-color:#8a6d1c!important;color:#fde68a!important;font-weight:600}
  .gcbox{display:block;margin:8px 0}
  .ph{position:relative;display:inline-block;margin:4px}
  .ph img{display:block}
  .pdel{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:2px solid var(--bg,#14171f);background:#b91c1c;color:#fff;font-weight:700;padding:0;font-size:13px;line-height:1;cursor:pointer}
  .okb{background:#14532d!important;color:#bbf7d0!important;border-color:#22c55e!important}
  .callb{display:block;text-align:center;margin:10px 0;padding:12px;border-radius:12px;background:#166534;color:#fff;font-weight:700;text-decoration:none}
  .dvt{width:100%;border-collapse:collapse;font-size:14px}
  .dvt th{background:#1b202a;color:#9aa4b2;font-weight:600;font-size:12px;text-align:left;padding:8px;border-bottom:2px solid var(--line);position:sticky;top:0}
  .dvt td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .dvt tr.on td{background:#13281b}
  .dvt tr.on td.c-ten{border-left:3px solid #22c55e;font-weight:600}
  .dvt tr.sech td{background:#232937;font-weight:700;cursor:pointer;padding:10px 8px}
  .dvt .c-ten{cursor:pointer}
  .dvt .c-gia{text-align:right;white-space:nowrap}
  .dvt .c-sl{text-align:center;white-space:nowrap}
  .dvt .c-nv select{padding:6px;font-size:13px;min-width:90px}
  .dvt .addb{padding:6px 10px;font-size:13px;border-radius:8px}
  .nvseg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:nowrap}
  .nvseg button{background:transparent;border:none;border-right:1px solid var(--line);border-radius:0;padding:6px 10px;font-size:13px;color:#cbd5e1;white-space:nowrap}
  .nvseg button:last-child{border-right:none}
  .nvseg button.on{background:#2f7cf6;color:#fff;font-weight:700}
  .selt td{padding:6px 8px}
  .selt tr.addr td{background:#1a1f29}
  .selt tr.addr input.tkTen{width:100%;min-width:140px}
  .selt tr.totr td{background:#11151c;font-weight:700;font-size:15px}
  .pickbar{position:sticky;top:0;z-index:5;background:var(--bg,#0e1117);padding:6px 0 4px}
  .srch{display:flex;align-items:center;gap:6px;background:#0b0e14;border:1px solid var(--line);border-radius:12px;padding:0 10px}
  .srch input{border:none!important;background:transparent!important;flex:1;padding:12px 0!important;font-size:15px}
  .srch button{background:#2a303c;border:none;border-radius:50%;width:26px;height:26px;padding:0;color:#cbd5e1}
  .catbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 2px}
  .catbar::-webkit-scrollbar{display:none}
  .catbar button{flex:0 0 auto;white-space:nowrap;border-radius:999px;padding:8px 14px;font-size:14px;background:#1b202a;border:1px solid var(--line);color:#cbd5e1}
  .catbar button i{font-style:normal;opacity:.6;font-size:12px;margin-left:2px}
  .catbar button.on{background:#2f7cf6;border-color:#2f7cf6;color:#fff;font-weight:700}
  .picklist{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px}
  .pk{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer;background:#141821}
  .pk:last-child{border-bottom:none}
  .pk:nth-child(even){background:#171c26}
  .pk:active{background:#1f2a3d}
  .pk.on{background:#13281b;box-shadow:inset 3px 0 0 #22c55e}
  .pk-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .pk-t b{font-size:15px;font-weight:600}
  .pk-t .mute{font-size:11px}
  .pk-t mark{background:#facc15;color:#111;border-radius:3px;padding:0 1px}
  .pk-g{color:#f5c542;font-weight:700;white-space:nowrap;font-size:15px}
  .pk-b{display:flex;align-items:center;gap:6px}
  .pk-b .plus{width:34px;height:34px;border-radius:10px;background:#2f7cf6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
  .pk-b .cnt{min-width:24px;height:24px;border-radius:12px;background:#22c55e;color:#04210f;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 6px}
  .nvbar{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .nvbar .nvseg button{padding:8px 14px;font-size:14px}
  .pk-nv button{padding:8px 11px;font-size:13px}
  .pk-nv .cnt2{display:inline-block;min-width:18px;border-radius:9px;background:#fff;color:#1d4ed8;font-weight:800;font-size:11px;padding:0 4px;margin-left:2px}
  .pk{cursor:default}
  @media(max-width:640px){.pk{flex-wrap:wrap}.pk-t{flex-basis:60%}.pk-nv{width:100%}.pk-nv button{flex:1}}
  table.kb{border-collapse:collapse;border:1px solid #3a4352}
  table.kb th,table.kb td{border:1px solid #3a4352!important;padding:8px 10px}
  table.kb thead th{background:#252c3a;color:#e5e7eb;font-size:13px;font-weight:700;text-transform:none}
  table.kb tbody tr:nth-child(even) td{background:#161b24}
  table.kb tbody tr.on td{background:#12291b}
  table.kb tr.on td.c-ten{border-left:1px solid #3a4352!important;box-shadow:inset 3px 0 0 #22c55e}
  table.kb .c-tt{text-align:right;white-space:nowrap;color:#f5c542;font-weight:800;font-size:15px}
  table.kb .c-no{text-align:center;white-space:nowrap;color:#9aa4b2}
  table.kb .c-no span{margin-left:4px}
  .xdel{background:#3a1717;color:#fca5a5;border:none;border-radius:6px;width:24px;height:24px;padding:0;font-size:12px}
  .addv{background:#2f7cf6;color:#fff;border:none;border-radius:8px;padding:8px 12px;font-weight:700}
  table.kb tr.totr td{background:#0f141c!important;font-size:16px;font-weight:800}
  table.kb tr.totr .c-tt{font-size:18px}
  table.kb .dvp{border-bottom:none!important}
  table.kb.selt{width:100%}
  table.kb.selt td,table.kb.selt th{padding:6px 7px}
  table.kb .nvseg button{padding:7px 8px;font-size:13px}
  table.kb .stp{gap:4px}
  table.kb .stp button{width:28px;height:28px;font-size:16px}
  table.kb .dvp{width:78px!important}
  table.kb.selt .c-ten{min-width:90px}
  .selt tr.addr input.tkTen{min-width:90px!important;padding:8px!important}
  .addbox{display:flex;gap:6px;justify-content:flex-end;align-items:center}
  .addbox input{width:90px!important;background:#0b0e14!important;border:1px solid var(--line)!important;border-radius:8px!important;padding:8px!important;text-align:right}
  .m-only{display:none}
  @media(max-width:600px){
    table.kb .c-dg{display:none}
    .m-only{display:flex;align-items:center;justify-content:flex-end;gap:2px;margin-top:2px}
    .m-only .dvp{width:64px!important;font-size:12px!important;color:#9aa4b2!important;font-weight:600}
    table.kb.selt td,table.kb.selt th{padding:5px 4px;font-size:13px}
    table.kb .nvseg{display:grid;grid-template-columns:1fr 1fr}
    table.kb .nvseg button{padding:6px 4px;font-size:12px;border-bottom:1px solid var(--line)}
    table.kb .stp{flex-direction:column-reverse;gap:2px}
    table.kb .stp button{width:26px;height:24px}
    table.kb .c-tt{font-size:13px}
    table.kb.selt .c-ten{min-width:0;font-size:13px}
    table.kb .c-no .xdel{width:20px;height:20px}
    table.kb .c-no span{display:block;margin:2px 0 0}
    .addbox{flex-direction:column;align-items:stretch}
    .addbox input{width:100%!important}
    table.kb.pkt td,table.kb.pkt th{padding:6px 5px}
    table.kb.pkt .c-tt{font-size:13px}
    .totl{font-size:13px!important}
    .selt tr.addr input.tkTen{min-width:0!important;width:100%!important;font-size:12px;padding:6px!important}
    table.kb.selt{table-layout:fixed}
    table.kb.selt th:nth-child(1){width:28px!important}
    table.kb.selt th:nth-child(3){width:96px}
    table.kb.selt th:nth-child(4){width:38px;font-size:11px}
    table.kb.selt th:nth-child(6){width:80px}
    table.kb.selt td{word-break:break-word}
    table.kb.selt .c-tt{font-size:12px}
    table.kb.selt .totr td{font-size:13px!important}
    table.kb.selt .totr .c-tt{font-size:14px!important}
  }
  .nvtag2{display:inline-block;background:#1e3a8a;color:#dbeafe;border-radius:6px;padding:3px 8px;font-size:13px;font-weight:600}
  .stb{border-radius:8px;padding:7px 10px;font-size:13px;background:#2a303c;border:1px solid #4b5563;color:#e5e7eb;white-space:nowrap}
  .stb.ok{background:#15803d;border-color:#22c55e;color:#fff;font-weight:700}
  table.kb.ptb .c-ten{font-weight:600}
  @media(max-width:600px){
    table.kb.ptb td,table.kb.ptb th{padding:5px 4px;font-size:12px}
    table.kb.ptb .stb{padding:6px 5px;font-size:11px}
    table.kb.ptb .nvtag2{font-size:11px;padding:2px 5px}
    table.kb.ptb .c-tt{font-size:12px}
    table.kb.ptb .addv{padding:7px 8px;font-size:12px}
  }
  .cds{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
  .cds.open{border-color:#2f7cf6}
  .cds-h{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
  .cds-i{font-size:22px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:#232937;border-radius:10px}
  .cds-b{padding:4px 12px 14px;border-top:1px solid var(--line)}
  .cdin{width:100%;background:transparent!important;border:1px solid transparent!important;padding:6px!important;border-radius:6px!important}

  .warnbox{background:#3a2a10;border:1px solid #a16207;color:#fde68a;border-radius:10px;padding:10px 12px}
  .okbox{background:#12291b;border:1px solid #22c55e;color:#86efac;border-radius:10px;padding:10px 12px}
  .thieu{display:inline-block;background:#3b1414;color:#fca5a5;border:1px solid #7f1d1d;border-radius:6px;padding:2px 7px;font-size:12px;margin:2px 0}
  .thieu.hl{background:#b91c1c;color:#fff}
  .bcpick{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
  .bcnav{display:flex;align-items:stretch;gap:8px;margin-top:10px}
  .bcnav>button{width:56px;font-size:26px;border-radius:12px;background:#232937;border:1px solid var(--line);color:#fff}
  .bclbl{flex:1;position:relative;text-align:center;color:#fff!important;margin:0!important;background:#0b0e14;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:18px;font-weight:800;cursor:pointer}
  .bclbl input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
  .kpi span{font-size:12px;color:#9aa4b2}
  .kpi b{font-size:22px}
  .kpi b.y{color:#f5c542}.kpi b.g{color:#4ade80}.kpi b.r{color:#f87171}
  .kpi i{font-style:normal;font-size:12px;color:#9aa4b2}
  table.bct .br{text-align:right}
  .paidtag{display:inline-block;background:#14532d;color:#bbf7d0;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700}

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }

      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {

        } else if (i < 9) {

        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

        for (var i = 0; i < ecdata[r].length; i += 1) {

        }

      for (var i = 0; i < rsBlocks.length; i += 1) {

      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {

            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {

            index += 1;
          }
        }

          + '>'
          + totalDataCount * 8
          + ')';

        buffer.put(0, 4);
      }

      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);

        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);

const $ = s => document.querySelector(s);
const fmt = n => (Number(n)||0).toLocaleString('vi-VN');
const parseTien = v => Number(String(v||'').replace(/\D/g,''))||0;
const fmtTien = v => { const d = String(v).replace(/\D/g,''); return d ? Number(d).toLocaleString('vi-VN') : ''; };
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayOf(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hm(ts){ return new Date(ts).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}); }
const tongPhieu = p => p.items.reduce((s,i)=>s+Number(i.gia||0),0);
const daTra = p => p.tt==='da';
function payments(p){
  if(Array.isArray(p.tts)) return p.tts;
  const a=[];
  if(Number(p.truoc)>0) a.push({id:'old1',t:p.ngayNhan,so:Number(p.truoc),hinh:'',noi:'Trả trước',co:p.co});
  if(p.tt==='da' && Number(p.daTraSo)>0) a.push({id:'old2',t:p.ngayTra||p.ngayNhan,so:Number(p.daTraSo),hinh:p.hinh||'',noi:p.noiNhan||'',co:p.coTra||p.co});
  return a;
}
const daThu = p => payments(p).reduce((s,x)=>s+Number(x.so||0),0);
const conLai = p => Math.max(0, tongPhieu(p)-daThu(p));
const ttTen = x => x.hinh==='ck' ? 'CK vào '+(x.noi||'chưa rõ') : x.hinh==='tm' ? 'Tiền mặt, '+(x.noi||'chưa rõ') : (x.noi||'Chưa ghi hình thức');
function ttSync(p){
  const L=payments(p), last=L[L.length-1]||{};
  if(L.length && conLai(p)<=0){ p.tt='da'; p.ngayTra=last.t; p.daTraSo=daThu(p); p.hinh=last.hinh||''; p.noiNhan=last.noi||''; p.coTra=last.co||p.co; }
  else { p.tt='chua'; p.ngayTra=null; p.daTraSo=0; p.hinh=''; }
}
let selTra={};
function payOf(p,i){ const L=payments(p); return L.find(x=>String(x.id)===String(i.traId)) || (daTra(p)?L[L.length-1]:null); }
function payTag(p,i){ const L=payments(p), x=payOf(p,i); if(!x) return '<span class="paidtag">Đã trả</span>'; const k=L.indexOf(x)+1;
  return `<span class="paidtag ${x.hinh==='ck'?'ck':''}">Đã trả · lần ${k}</span><div style="font-size:11px;margin-top:2px;color:#cbd5e1">${x.hinh==='ck'?'🏦 CK '+esc(x.noi||''):x.hinh==='tm'?'💵 '+esc(x.noi||''):esc(x.noi||'')}</div>`; }
function selTraTong(p){ const s=selTra[p.id]||[]; return s.reduce((t,ix)=>t+Number((p.items[ix]||{}).gia||0),0); }
function toggleSelTra(id,ix,on){ const p=db.phieu.find(x=>x.id===id); if(!p) return; let s=selTra[id]||[]; s=on?[...new Set([...s,ix])]:s.filter(x=>x!==ix); selTra[id]=s; const el=$('#tien'); if(el) el.value=fmt(s.length?Math.min(selTraTong(p),conLai(p)):conLai(p)); const n=$('#tienNote'); if(n) n.textContent=s.length?`Đang thu cho ${s.length} món đã tích`:'Đang thu toàn bộ phần còn lại'; }
function thuTien(id,hinh,noi){
  const p=db.phieu.find(x=>x.id===id); if(!p) return;
  const so=parseTien(($('#tien')||{}).value);
  if(so<=0){ toast('Nhập số tiền khách trả.'); return; }
  if(!Array.isArray(p.tts)){ p.tts=payments(p).map(x=>({...x})); p.truoc=0; }
  const pay={id:Date.now(),t:Date.now(),so,hinh,noi:noi||'',co:locOf(p)};
  p.tts.push(pay);
  let sel=selTra[id]||[]; if(!sel.length){ const un=p.items.map((i,ix)=>i.traId?-1:ix).filter(ix=>ix>=0); const sum=un.reduce((t,ix)=>t+Number(p.items[ix].gia||0),0); if(un.length && so>=Math.min(sum,conLai(p)+daThu(p)) && so>=conLai(p)) sel=un; }
  sel.forEach(ix=>{ if(p.items[ix]) p.items[ix].traId=pay.id; }); selTra[id]=[];
  ttSync(p); if(daTra(p)) p.items.forEach(i=>{ if(!i.traId) i.traId=pay.id; });
  save(); toast(daTra(p)?'Đã thu đủ tiền':'Đã ghi '+fmt(so)+'đ, còn '+fmt(conLai(p))+'đ'); openPhieu(id); renderList();
}
function xoaTT(id,pid){
  ask('Xóa lần thu tiền này?', ()=>{
    const p=db.phieu.find(x=>x.id===id); if(!p) return;
    if(!Array.isArray(p.tts)){ p.tts=payments(p).map(x=>({...x})); p.truoc=0; }
    p.tts=p.tts.filter(x=>String(x.id)!==String(pid)); p.items.forEach(i=>{ if(String(i.traId)===String(pid)) delete i.traId; });
    ttSync(p); save(); openPhieu(id); renderList();
  });
}
const locOf = p => p.hienTai || p.co;

}

  if(!draft.ten.trim() && !draft.sdt.trim()){ toast('Nhập tên hoặc số điện thoại khách.'); return; }
  if(!draft.items.length){ toast('Chọn ít nhất một dịch vụ.'); return; }
  const p = {
    id:Date.now(), co:draft.co, hienTai:draft.co, ma:await nextMaSync(draft.co),
    ten:draft.ten.trim(), sdt:draft.sdt.trim(), anhs:[...draft.anhs],
    items:draft.items.map(i=>({...i})), nv:draft.nv, ghichu:draft.ghichu.trim(),
    buoc:0, lichSu:[{buoc:BUOC[0], t:Date.now()}],
    tt:'chua', hinh:'', daTraSo:0, ngayNhan:Date.now(), ngayTra:null, hen:draft.hen||henItems(draft.items)
  };
  db.phieu.unshift(p); save();
  LS.removeItem(DRAFT_KEY); filt.st='all'; filt.q='';
  const co = draft.co;
  draft = {co, ten:'', xung:'', sdt:'', anhs:[], items:[], nv:p.nv, pinNv:draft.pinNv||'', ghichu:''};
  render(); window.scrollTo(0,0);
  toast('Đã lưu phiếu '+p.ma+'. Nhập khách tiếp theo');
}
function withXung(ten, x){ const t=(ten||'').trim().replace(/^[AC]\s+/,''); if(!t) return ''; return x ? x+' '+t : t; }
function zaloText(p){
  return `${p.ma} | ${CO[p.co]}
Khách: ${p.ten||'-'} - ${p.sdt||'-'}
Đồ: ${p.items.map(i=>i.ten+' ('+fmt(i.gia)+'đ)').join(', ')}
Tổng: ${fmt(tongPhieu(p))}đ
NV nhận: ${p.nv||'-'}${p.ghichu?'\nGhi chú: '+p.ghichu:''}`;
}
function replyText(p){
  const tien = fmt(conLai(p));
  const ten = (p.ten||'').replace(/^[AC]\s+/,'');
  const xung = ten ? 'A/C '+ten : 'A/C';
  if(p.buoc===2){
    return `Chào ${xung}, đồ mã ${p.ma} bên e làm xong rồi ạ. Tiệm mở cửa 7:30 đến 17:00 mỗi ngày, A/C ghé tiệm kiểm tra và lấy đồ giúp e với ạ. Cảm ơn A/C đã tin tưởng SPA ĐỒ HIỆU TỬ TẾ ạ.`;
  }
  if(p.buoc===0) return `Chào ${xung}, bên e đã nhận đồ mã ${p.ma} ạ. Đồ làm xong e sẽ báo A/C ngay, cảm ơn A/C đã tin tưởng SPA ĐỒ HIỆU TỬ TẾ ạ.`;
  return `Chào ${xung}, đồ mã ${p.ma} bên e đang làm ạ. Xong e sẽ báo A/C ngay nhé.`;
}
function copyEl(id){
  const t = document.getElementById(id).innerText;
  navigator.clipboard ? navigator.clipboard.writeText(t).then(()=>toast('Đã sao chép'), ()=>fallbackCopy(t)) : fallbackCopy(t);
}
function fallbackCopy(t){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); toast('Đã sao chép'); }
function toast(m){ document.querySelectorAll('.toastx').forEach(x=>x.remove()); const d=document.createElement('div'); d.className='toastx'; d.textContent=m; d.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#22c55e;color:#052;padding:10px 16px;border-radius:10px;z-index:20;font-weight:600'; document.body.appendChild(d); setTimeout(()=>d.remove(),1500); }

/* ---------- 2. PHIẾU ---------- */
const FST=[
  ['all','Tất cả',p=>true],
  ['nhan','📥 Đã nhận',p=>dangLam(p)&&!batDau(p)],
  ['lam','🔧 Đang làm',p=>dangLam(p)&&batDau(p)],
  ['tre','⏰ Trễ hẹn',p=>ngayTre(p)>0],
  ['cho','✔ Chờ trả khách',p=>choLay(p)],
  ['no','💰 Còn nợ',p=>!daTra(p)],
  ['chua','📥 Chưa trả khách',p=>!p.ngayLay],
  ['lay','📦 Đã trả khách',p=>!!p.ngayLay],
];
const ST_ORDER={tre:0,today:1,cho:2,lam:3,nhan:4,layno:5,done:6};
function coCard(co,v,cnt,noSum,unit){
  v=v||'filt'; const F=v==='filt'?filt:khF;
  cnt=cnt||(fn=>db.phieu.filter(p=>locOf(p)===co&&fn(p)).length);
  const no = noSum!=null?noSum:db.phieu.filter(p=>locOf(p)===co&&!daTra(p)).reduce((x,p)=>x+conLai(p),0);
  const t=cnt(p=>!p.ngayLay&&ngayTre(p)>0), on=F.co===co;
  const cell=(st,cls,lbl,n)=>`<button type="button" class="cc2 ${cls} ${on&&F.st===st?'sel':''}" onclick="event.stopPropagation();${v}.co='${co}';${v}.st='${st}';render()"><b>${n}</b><span>${lbl}</span></button>`;
  return `<div class="coc2 co-${co} ${on?'on':''}" onclick="${v}.co='${co}';${v}.st='all';render()">
    <div class="coc2-h">📍 ${co==='vinh'?'VINH':'CỬA LÒ'}${t?`<em>⏰ ${t} trễ</em>`:''}</div>
    <div class="coc2-g">${cell('chua','c1','Chưa trả khách',cnt(p=>!p.ngayLay))}${cell('lay','c2','Đã trả khách',cnt(p=>!!p.ngayLay))}${cell('no','c3','Còn nợ',fmt(no)+'đ')}</div>
  </div>`;
}
function flowHTML(base,v,cnt,total,noSum){
  v=v||'filt'; const F=v==='filt'?filt:khF;
  cnt=cnt||(fn=>base.filter(fn).length);
  const n=k=>cnt(FST.find(x=>x[0]===k)[2]);
  const no=noSum!=null?noSum:base.filter(p=>!daTra(p)).reduce((x,p)=>x+conLai(p),0);
  const st=(k,cls,step,ic,lbl,val)=>`<button type="button" class="fs ${cls} ${F.st===k?'sel':''} ${val?'':'zero'}" onclick="${v}.st='${F.st===k?'all':k}';render()"><em>${step}</em><span class="fs-l">${ic} ${lbl}</span><b>${val}</b></button>`;
  return `<div class="steps">
    ${st('nhan','f-nhan','1','📥','Đã nhận',n('nhan'))}<i class="sa">›</i>
    ${st('lam','f-lam','2','🔧','Đang làm',n('lam'))}<i class="sa">›</i>
    ${st('cho','f-cho','3','✔','Xong, chờ trả',n('cho'))}<i class="sa">›</i>
    ${st('lay','f-lay','4','📦','Đã trả khách',n('lay'))}
  </div>
  <div class="steps2">
    ${st('tre','f-tre','!','⏰','Trễ hẹn',n('tre'))}
    <button type="button" class="fs f-no ${F.st==='no'?'sel':''} ${n('no')?'':'zero'}" onclick="${v}.st='${F.st==='no'?'all':'no'}';render()"><em>₫</em><span class="fs-l">💰 Còn nợ <small>${fmt(no)}đ</small></span><b>${n('no')}</b></button>
    <button type="button" class="fs f-all ${F.st==='all'?'sel':''}" onclick="${v}.st='all';render()"><em>≡</em><span class="fs-l">📋 Tất cả</span><b>${total!=null?total:base.length}</b></button>
  </div>`;
}
function viewPhieu(){
  const base=db.phieu.filter(p=>(filt.co==='all'||locOf(p)===filt.co) && (!filt.q || [p.ma,p.ten,p.sdt].some(x=>dvNorm(x).includes(dvNorm(filt.q)))));
  const f=FST.find(x=>x[0]===filt.st)||FST[0];
  const list=base.filter(f[2]).sort((a,b)=>(ST_ORDER[stOf(a).k]-ST_ORDER[stOf(b).k])||(b.ngayNhan-a.ngayNhan));
  const chip=([k,l,fn])=>{ const n=base.filter(fn).length; return `<button type="button" class="ft-${k} ${filt.st===k?'on':''} ${n||k==='all'?'':'zero'}" onclick="filt.st='${k}';render()">${l}<b>${n}</b></button>`; };
  const g=k=>FST.find(x=>x[0]===k);
  const coName=filt.co==='vinh'?'Vinh':filt.co==='cualo'?'Cửa Lò':'cả 2 cơ sở';
  const grp = filt.co==='all'
    ? ['vinh','cualo'].map(co=>{ const L=list.filter(p=>locOf(p)===co); return L.length?`<div class="cohead co-${co}">📍 ${co==='vinh'?'CƠ SỞ VINH':'CƠ SỞ CỬA LÒ'} <span>${L.length} phiếu</span></div>${listHTML(L)}`:''; }).join('') || listHTML([])
    : listHTML(list);
  return `
  <div class="cogrid2">${coCard('vinh')}${coCard('cualo')}</div>
  <div class="cosw">${[['all','Cả 2 cơ sở'],['vinh','📍 Vinh'],['cualo','📍 Cửa Lò']].map(([k,l])=>`<button type="button" class="${filt.co===k?'on':''} co-${k}" onclick="filt.co='${k}';render()">${l}</button>`).join('')}</div>
  <div class="srch" style="margin-bottom:8px"><span>🔍</span><input placeholder="Tìm mã, tên, SĐT" value="${esc(filt.q)}" oninput="filt.q=this.value;clearTimeout(window._pq);window._pq=setTimeout(()=>{render();const i=document.querySelector('#app .srch input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},300)">${filt.q?`<button type="button" onclick="filt.q='';render()">✕</button>`:''}</div>
  ${flowHTML(base)}
  <div class="lhead">${(FST.find(x=>x[0]===filt.st)||FST[0])[1]} · ${coName} · <b>${list.length} phiếu</b></div>
  <div id="list">${grp}</div>`;
}
function choLay(p){ return !p.ngayLay && (p.buoc===2 || (p.items||[]).some(i=>i.xong)); }
function henGoiY(ten){ const t=dvNorm(ten);
  if(/thay de|pic|pickle|thay cum|thay mat|repain|repair/.test(t)) return 4;
  if(/phuc hoi|son |son$|dung form|xi ma|nhuom|doi mau/.test(t)) return 5;
  if(/dan |dan$|keo/.test(t)) return 3;
  if(/express/.test(t)) return 1;
  if(/ve sinh|tay o|khu/.test(t)) return 2;
  return 3; }
function henDays(ten){ const d=db.dv.find(x=>x.ten===ten); return d&&Number(d.hen)>0?Number(d.hen):henGoiY(ten); }
function addDay(ds,n){ const d=new Date(ds+'T12:00:00'); d.setDate(d.getDate()+n); return dayOf(d.getTime()); }
function henItems(items,from){ const n=Math.max(0,...(items||[]).map(i=>henDays(i.ten))); return addDay(from||today(), n||3); }
function henCua(p){ return p.hen || henItems(p.items, dayOf(p.ngayNhan)); }
function ddmm(ds){ const thu=['CN','T2','T3','T4','T5','T6','T7']; return thu[new Date(ds+'T12:00:00').getDay()]+', '+ds.split('-').reverse().slice(0,2).join('/'); }
function xongHet(p){ return p.buoc===2 || ((p.items||[]).length && p.items.every(i=>i.xong)); }
function ngayTre(p){ if(xongHet(p)) return 0; const n=Math.round((new Date(today()+'T12:00:00')-new Date(henCua(p)+'T12:00:00'))/86400000); return n>0?n:0; }
function denHen(p){ return !xongHet(p) && henCua(p)===today(); }
function dsTre(){ return db.phieu.filter(p=>ngayTre(p)).sort((a,b)=>ngayTre(b)-ngayTre(a)); }
function setNgay(id,k,v){
  const p=db.phieu.find(x=>x.id===id); if(!p) return;
  if(k==='nhan'){ if(!v) return; const o=new Date(p.ngayNhan), d=new Date(v+'T12:00:00'); d.setHours(o.getHours(),o.getMinutes(),0,0); p.ngayNhan=d.getTime(); }
  else if(k==='hen'){ p.hen=v||''; }
  else if(k==='lay'){ p.ngayLay=v||''; if(v && p.buoc!==2){ p.buoc=2; p.lichSu.push({buoc:BUOC[2],t:Date.now()}); (p.items||[]).forEach(i=>i.xong=true); } }
  save(); openPhieu(id); renderList(); toast('Đã lưu ngày');
}
function ngayTableHTML(p){
  const nh=dayOf(p.ngayNhan), h=henCua(p), late=ngayTre(p);
  const di=(k,v,ph)=>`<label class="dpick">${v?ddmm(v)+'/'+v.slice(0,4):`<span class="mute">${ph}</span>`}<input type="date" value="${v||''}" onclick="try{this.showPicker()}catch(e){}" onchange="setNgay(${p.id},'${k}',this.value)"></label>`;
  const sb=(k,v,n,l)=>`<button type="button" class="sm" onclick="setNgay(${p.id},'${k}','${addDay(v,n)}')">${l}</button>`;
  const stt = p.ngayLay ? '<span class="hc ok" style="margin:0">📦 Đã trả khách</span>' : late ? `<span class="hc late" style="margin:0">⏰ Trễ ${late} ngày</span>` : xongHet(p) ? '<span class="hc ok" style="margin:0">✔ Xong, chờ trả khách</span>' : denHen(p) ? '<span class="hc today" style="margin:0">📅 Hôm nay hẹn</span>' : `<span class="hc" style="margin:0">Còn ${Math.round((new Date(h+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000)} ngày</span>`;
  return `<h3 style="display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center"><span>Ngày hẹn</span>${stt}</h3>
  <div class="tbw"><table class="dvt kb ngt" style="width:100%"><tbody>
    <tr><td class="ngl">📥 Ngày nhận</td><td>${di('nhan',nh,'')}</td><td class="ngb"><span class="mute" style="font-size:12px">${hm(p.ngayNhan)}</span></td></tr>
    <tr class="${late?'lt':''}"><td class="ngl">📅 Hẹn trả</td><td>${di('hen',h,'')}</td><td class="ngb">${sb('hen',h,-1,'− 1')}${sb('hen',h,1,'+ 1')}${p.hen?`<button type="button" class="sm" title="Theo gợi ý dịch vụ" onclick="setNgay(${p.id},'hen','')">↺</button>`:''}</td></tr>
    <tr class="${p.ngayLay?'on':''}"><td class="ngl">📦 Trả khách</td><td>${di('lay',p.ngayLay,'Chưa trả khách')}</td><td class="ngb">${p.ngayLay?`<button type="button" class="sm bad" onclick="setNgay(${p.id},'lay','')">Bỏ</button>`:`<button type="button" class="addv" style="padding:6px 10px;font-size:13px" onclick="setNgay(${p.id},'lay',today())">Trả khách hôm nay</button>`}</td></tr>
  </tbody></table></div>`;
}
function henChip(p){
  const h=henCua(p), d=ddmm(h), n=Math.round((new Date(h+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);
  if(p.ngayLay) return `<div class="hc ok">📦 Đã trả khách ${ddmm(p.ngayLay)}</div>`;
  if(xongHet(p)) return `<div class="hc ok">✔ Xong · hẹn ${d}</div>`;
  if(n<0) return `<div class="hc late ${-n>=2?'blink':''}">⏰ Trễ ${-n} ngày · hẹn ${d}</div>`;
  if(n===0) return `<div class="hc today">📅 Hẹn hôm nay · ${d}</div>`;
  return `<div class="hc">📅 Hẹn ${d} · còn ${n} ngày</div>`;
}
function treTag(p){ const n=ngayTre(p); return n?`<div class="tre ${n>=2?'r':''}">⏰ Trễ hẹn ${n} ngày</div>`:denHen(p)?`<div class="tre" style="background:#713f12;border-color:#eab308;color:#fef08a">📅 Hôm nay hẹn trả</div>`:''; }
function treBanner(){ return ''; }
function renderTreBar(){
  const el=document.getElementById('treBar'); if(!el) return;
  const L=dsTre(), H=db.phieu.filter(denHen);
  if(!L.length && !H.length){ el.innerHTML=''; el.className=''; document.documentElement.style.setProperty('--tbh','0px'); return; }
  document.documentElement.style.setProperty('--tbh','38px');
  const items=[...L.map(p=>`⏰ ${p.ma} ${esc(p.ten||'')} · trễ hẹn ${ngayTre(p)} ngày (hẹn ${ddmm(henCua(p))})`), ...H.map(p=>`📅 ${p.ma} ${esc(p.ten||'')} · hôm nay hẹn trả`)].join('&nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;');
  el.className='trebar '+(L.length?'':'y');
  el.innerHTML=`<div class="tb-lbl">${L.length?`⚠️ ${L.length} ĐƠN TRỄ HẸN`:`📅 ${H.length} ĐƠN HẸN HÔM NAY`}</div><div class="tb-run"><span style="animation-duration:${Math.max(12,(L.length+H.length)*6)}s">${items}</span></div>`;
  el.onclick=()=>{ filt.st=L.length?'tre':'all'; filt.q=''; go('phieu'); };
}
function batDau(p){ return p.buoc===1 || (p.items||[]).some(i=>i.xong); }
function dangLam(p){ return !p.ngayLay && !xongHet(p); }
function cntCho(){ return db.phieu.filter(choLay).length; }
function stOK(p){ const f=FST.find(x=>x[0]===filt.st)||FST[0]; return f[2](p); }
function renderList(){
  const list = db.phieu.filter(p =>
    (filt.co==='all'||locOf(p)===filt.co) &&
    stOK(p) &&
    (!filt.q || [p.ma,p.ten,p.sdt].some(x=>String(x||'').toLowerCase().includes(filt.q.toLowerCase())))
  );
  const el=$('#list'); if(el){ render(); return; } else if(!$('#sheet').classList.contains('show')) render();
}
function tbThumbs(p){
  const l = listAnh(p).slice(0,1);
  if(!l.length) return '';
  return `<div class="anhs one"><img src="${l[0]}"></div>`;
}
function dvList(p){ return p.items.map((i,ix)=>`<div class="dvl"><span>${i.xong?'<b style="color:#4ade80">✔</b> ':''}${ix+1}. ${esc(i.ten)}${i.nv?` <span class="nvtag">${esc(i.nv)}</span>`:''}</span><span>${fmt(i.gia)}đ</span></div>`).join(''); }
function tbTag(p){ const part=!daTra(p)&&daThu(p)>0; return `<span class="tag ${daTra(p)?'paid':'unpaid'}" ${part?'style="background:#1e3a5f;color:#93c5fd"':''}>${daTra(p)?'Đã trả':part?'Trả 1 phần, còn '+fmt(conLai(p))+'đ':'Chưa trả'}</span>`; }
function stOf(p){
  const no=conLai(p);
  if(p.ngayLay) return daTra(p)?{k:'done',t:'📦 Đã trả khách',s:ddmm(p.ngayLay)}:{k:'layno',t:'📦 Đã trả khách · còn nợ',s:ddmm(p.ngayLay)};
  if(ngayTre(p)) return {k:'tre',t:`⏰ Trễ ${ngayTre(p)} ngày`,s:'hẹn '+ddmm(henCua(p))};
  if(xongHet(p)) return {k:'cho',t:'✔ Xong, chờ trả khách',s:'hẹn '+ddmm(henCua(p))};
  if(denHen(p)) return {k:'today',t:'📅 Hẹn hôm nay',s:p.buoc===1?'đang làm':'chưa làm'};
  const n=Math.round((new Date(henCua(p)+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);
  return p.buoc===1||(p.items||[]).some(i=>i.xong) ? {k:'lam',t:'🔧 Đang làm',s:`hẹn ${ddmm(henCua(p))} · còn ${n} ngày`} : {k:'nhan',t:'📥 Đã nhận',s:`hẹn ${ddmm(henCua(p))} · còn ${n} ngày`};
}
function stCell(p){
  const st=stOf(p), no=conLai(p);
  const tien = daTra(p) ? '<span class="mt ok">💰 Đã trả đủ</span>' : daThu(p)>0 ? `<span class="mt part">💰 Còn ${fmt(no)}đ</span>` : `<span class="mt no">💰 Chưa trả ${fmt(no)}đ</span>`;
  const x=(p.items||[]).filter(i=>i.xong).length;
  return `<div class="stb2 ${st.k}"><b>${st.t}</b><span>${st.s}</span></div>${tien}${(p.items||[]).length>1&&!p.ngayLay?`<div class="mute" style="font-size:11px;margin-top:3px">Xong ${x}/${p.items.length} món</div>`:''}`;
}
function dvGon(p){
  const it=p.items||[], max=3;
  return it.slice(0,max).map(i=>`<div class="dg ${i.xong?'x':''}"><span>${i.xong?'✔ ':''}${esc(i.ten)}</span><b>${fmt(i.gia)}</b></div>`).join('')+(it.length>max?`<div class="mute" style="font-size:12px">+ ${it.length-max} món khác</div>`:'');
}
function rowHTML(p,showKh){
  const st=stOf(p), anh=listAnh(p)[0];
  const tien = daTra(p) ? '<span class="tt ok">Đã trả đủ</span>' : `<span class="tt no">Nợ ${fmt(conLai(p))}đ</span>`;
  return `<tr class="prow r-${st.k}" onclick="openPhieu(${p.id})">
    <td class="c-p"><div class="cpw">${anh?`<img class="pthumb" src="${anh}">`:'<div class="pthumb none">📷</div>'}<div><b class="pma">${p.ma}</b>${showKh?`<div class="pkh">${esc(p.ten||'Khách lẻ')}</div><div class="psdt">${esc(p.sdt||'')}</div>`:''}</div></div></td>
    <td class="c-dv">${dvGon(p)}<div class="dtot">${p.items.length} món · <b>${fmt(tongPhieu(p))}đ</b></div>${p.ghichu?`<div class="gcn" style="margin-top:4px">📝 ${esc(p.ghichu)}</div>`:''}</td>
    <td class="c-st"><div class="sb ${st.k}"><b>${st.t}</b><span>${st.s}</span></div>${tien}</td>
  </tr>`;
}
function listHTML(list){
  if(!list.length) return '<div class="empty">Không có phiếu nào</div>';
  return `<div class="tbw"><table class="dvt kb plist2" style="width:100%"><thead><tr><th>Phiếu · khách</th><th>Dịch vụ</th><th style="width:170px">Tình trạng</th></tr></thead><tbody>${list.map(p=>rowHTML(p,true)).join('')}</tbody></table></div>`;
}
function thumbs(p){

function sdtZalo(sdt){ return String(sdt||'').replace(/\D/g,'').replace(/^84/,'0'); }
function msgLay(p){
  const ten=(p.ten||'').replace(/^(A|C|a|c|Anh|Chị|anh|chị|Zl|zl|Qkl|qkl|E|e)\s+/,'');
  const xung = ten ? 'A/C '+ten : 'A/C';
  const xong = p.items.filter(i=>i.xong), het = p.buoc===2 || xong.length===p.items.length;
  const mon = het ? `đồ mã ${p.ma}` : xong.map(i=>i.ten.toLowerCase()).join(', ')+` (phiếu ${p.ma})`;
  return `Chào ${xung}, ${mon} bên e làm xong rồi ạ. A/C ghé ${p.co==='cualo'?'cơ sở Cửa Lò':'cơ sở Vinh'} lấy đồ giúp e nhé, tiệm mở 7:30 đến 17:00 mỗi ngày. Cảm ơn A/C ạ.`;
}
function zaloLay(id){
  const p=db.phieu.find(x=>x.id===id); if(!p) return;
  const t=msgLay(p), so=sdtZalo(p.sdt);
  const go=()=>{ toast('Đã chép tin, dán vào Zalo rồi gửi'); openExt('https://zalo.me/'+so); };
  navigator.clipboard ? navigator.clipboard.writeText(t).then(go,()=>{ fallbackCopy(t); go(); }) : (fallbackCopy(t), go());
}
function openExt(u){
  let w=null; try{ w=window.open(u,'_blank'); }catch(e){}
  if(!w){ try{ window.top.location.href=u; }catch(e){ location.href=u; } }
}
function toggleXong(id,ix){
  const p=db.phieu.find(x=>x.id===id); if(!p) return;
  const it=p.items[ix]; it.xong=!it.xong; it.xongLuc=it.xong?Date.now():null;
  if(p.items.length && p.items.every(i=>i.xong) && p.buoc!==2){ setBuoc(id,2); toast('Xong hết, phiếu chuyển Hoàn thành'); return; }
  if(!it.xong && p.buoc===2) p.buoc=1;
  if(it.xong && p.buoc===0) p.buoc=1;
  save(); openPhieu(id); render();
}
function setBuoc(id,ix){
  const p = db.phieu.find(x=>x.id===id); if(!p) return;
  p.buoc = ix; p.lichSu.push({buoc:BUOC[ix], t:Date.now()});
  if(ix===2) (p.items||[]).forEach(i=>{ if(!i.xong){ i.xong=true; i.xongLuc=Date.now(); } });
  save(); openPhieu(id); renderList();
}
function setTruoc(id,v){

  p.truoc = Number(String(v).replace(/\D/g,''))||0; save(); openPhieu(id); renderList();
}
function traTien(id,hinh,noi){
  const p = db.phieu.find(x=>x.id===id); if(!p) return;
  const so = Number(String($('#tien').value).replace(/\D/g,''))||0;
  p.tt='da'; p.hinh=hinh; p.noiNhan=noi||''; p.daTraSo=so; p.ngayTra=Date.now(); p.coTra=locOf(p); save();

function setXung(sdt, x){

function soonCS(k){ if(!k.sdt) return false; const d=Math.floor((Date.now()-lastCS(k))/864e5); return d>=CS_NGAY-7 && d<CS_NGAY; }

const CS_NGAY = 30;
const VIP_MIN = 2000000;
function isVIP(k){ return k.phieu.some(p=>tongPhieu(p) > VIP_MIN); }
function lastCS(k){
  const cs = (db.chamSoc||{})[k.sdt] || [];
  const lastCare = cs.length ? cs[cs.length-1].t : 0;
  const lastVisit = Math.max(...k.phieu.map(p=>p.ngayNhan));
  return Math.max(lastCare, lastVisit);
}
function canCS(k){ return !!k.sdt && (Date.now()-lastCS(k)) >= CS_NGAY*864e5; }
function csLine(k){

/* Ảnh Drive: tải qua máy chủ (đổi sang data URL) để hiện được trên mọi máy */
const IMG_CACHE = {};
const IMG_BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
function driveId(u){ const m = String(u).match(/drive\.google\.com\/uc\?export=view&id=([\w-]+)/); return m ? m[1] : null; }
function fixImg(u){ const id = driveId(u); if(!id) return u; return IMG_CACHE[id] || IMG_BLANK; }
async function warmImgs(){
  const url = LS.getItem(SYNC_KEY), tok = LS.getItem(SYNC_TOKEN_KEY);
  if(!url) return;
  const ids = new Set();
  db.phieu.forEach(p=>(p.anhs||[]).forEach(a=>{ const id=driveId(a); if(id && !IMG_CACHE[id]) ids.add(id); }));
  if(!ids.size) return;
  let got = false;
  for(const id of ids){
    try{
      const r = await fetch(url+'?page=img&id='+encodeURIComponent(id)+'&token='+encodeURIComponent(tok));
      const j = await r.json();
      if(j.ok){ IMG_CACHE[id] = j.data; got = true; }
    }catch(e){}
  }
  if(got) render();
}
function loadImg(u){ return new Promise((res,rej)=>{ const im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>res(im); im.onerror=()=>rej(new Error('img')); im.src=u; }); }
function drawCover(g,im,x,y,w,h){
  const s = Math.max(w/im.naturalWidth, h/im.naturalHeight);
  const sw = w/s, sh = h/s, sx = (im.naturalWidth-sw)/2, sy = (im.naturalHeight-sh)/2;
  g.drawImage(im, sx, sy, sw, sh, x, y, w, h);
}
/* Tạo ảnh gửi Zalo: chữ thông tin bên trái, 1-2 ảnh đồ bên phải */
async function taoAnhZalo(p, ten){
  const W=1080, H=540, LW=560;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#111827'; g.fillRect(0,0,W,H);
  const urls = listAnh(p).slice(0,1);
  const ims = []; for(const u of urls){ try{ ims.push(await loadImg(u)); }catch(e){} }
  if(ims.length===1) drawCover(g, ims[0], LW, 0, W-LW, H);
  g.fillStyle='#fff'; g.font='bold 34px Arial'; let y=60;
  const line=(t,f,col)=>{ g.font=f; g.fillStyle=col||'#fff'; g.fillText(t,28,y); y+=Math.round(parseInt(f.match(/\d+/)[0])*1.45); };
  const cut=(t,w)=>{ if(g.measureText(t).width<=w) return t; let x=t; while(g.measureText(x+'…').width>w && x.length>4) x=x.slice(0,-1); return x+'…'; };
  g.font='bold 32px Arial'; line(cut((p.ma?p.ma+' · ':'')+(ten||p.ten||'Khách'),LW-52),'bold 32px Arial');
  line([p.sdt,CO[p.co].replace('Cơ sở ','')].filter(Boolean).join(' · '),'24px Arial','#9ca3af');
  y+=8; line('Dịch vụ:','bold 24px Arial','#f472b6');
  const gr=[]; (p.items||[]).forEach(i=>{ const k=(i.ten||'')+'|'+(i.nv||''); const f=gr.find(x=>x.k===k); if(f){ f.n++; f.tien+=Number(i.gia||0); } else gr.push({k,ten:i.ten||'',nv:i.nv||'',n:1,tien:Number(i.gia||0)}); });
  const maxL=gr.length>7?6:7;
  gr.slice(0,maxL).forEach(x=>{
    g.font='bold 24px Arial'; const tt=fmt(x.tien)+'đ', tw=g.measureText(tt).width;
    g.fillStyle='#fbbf24'; g.textAlign='right'; g.fillText(tt, LW-24, y); g.textAlign='left';
    g.font='24px Arial'; line(cut('• '+x.ten+(x.n>1?' ×'+x.n:'')+(x.nv?' · '+x.nv:''),LW-28-24-tw-14),'24px Arial');
  });
  if(gr.length>maxL) line('… +'+(gr.length-maxL)+' việc khác','22px Arial','#9ca3af');
  y+=8; line('Tổng: '+fmt(tongPhieu(p))+'đ','bold 30px Arial','#fbbf24');
  if(p.ma) line('Hẹn trả: '+ddmm(henCua(p)),'24px Arial','#9ca3af');
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png'));
}

function dataToFile(d,name){
  const m=String(d).match(/^data:([^;]+);base64,(.*)$/); if(!m) return null;
  const b=atob(m[2]), u=new Uint8Array(b.length); for(let k=0;k<b.length;k++) u[k]=b.charCodeAt(k);
  return new File([u], name, {type:m[1]});
}

function bcData(){
  const nhan = db.phieu.filter(p=>inKy(p.ngayNhan));
  const pays=[]; db.phieu.forEach(p=>payments(p).forEach(x=>{ if(inKy(x.t) && !x.cu) pays.push({p,x}); }));
  const paid=[...new Set(pays.map(r=>r.p))];
  const tm = pays.filter(r=>r.x.hinh==='tm').reduce((s,r)=>s+Number(r.x.so),0);
  const ck = pays.filter(r=>r.x.hinh==='ck').reduce((s,r)=>s+Number(r.x.so),0);

  const doanhThu = nhan.reduce((s,p)=>s+tongPhieu(p),0);
  const mapNV = {};
  const addNV = (n)=>{ if(!mapNV[n]) mapNV[n]={n, ids:new Set(), sv:0, dt:0}; return mapNV[n]; };
  db.nv.forEach(n=>addNV(n));
  nhan.forEach(p=>p.items.forEach(i=>{ const r = addNV(i.nv || p.nv || 'Chưa gán nhân viên'); r.ids.add(p.id); r.sv++; r.dt += Number(i.gia||0); }));
  const theoNV = Object.values(mapNV).map(r=>({n:r.n, so:r.ids.size, sv:r.sv, dt:r.dt})).filter(r=>r.sv>0 || db.nv.includes(r.n)).sort((a,b)=>b.dt-a.dt);
  const theoCo = Object.keys(CO).map(k=>{ const rs=pays.filter(r=>(r.x.co||r.p.co)===k); return {n:CO[k], so:new Set(rs.map(r=>r.p.id)).size, tien:rs.reduce((s,r)=>s+Number(r.x.so),0)}; });

  const chuaTra = nhan.filter(p=>!daTra(p));
  return {nhan, paid, pays, tm, ck, khac, doanhThu, theoNV, theoCo, noi:Object.entries(m), chuaTra, chuaTien:chuaTra.reduce((s,p)=>s+conLai(p),0)};
}

function nenAnh(file, cb){
  const r = new FileReader();
  r.onload = e => {
    const img = new Image();
    img.onload = () => {
      const max=900, s=Math.min(1, max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=img.width*s; c.height=img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.72));
    };
    img.src = e.target.result;
  };
  r.readAsDataURL(file);
}
function rawAnh(p){ return p.anhs || (p.anh ? [p.anh] : []); }
function themAnhPhieu(id, input){
  const fl=[...(input.files||[])]; input.value='';
  const p = db.phieu.find(x=>x.id===id); if(!p || !fl.length) return;
  fl.reduce((pr,f)=>pr.then(()=>new Promise(res=>nenAnh(f,d=>{ p.anhs = rawAnh(p).concat([d]); p.anh = undefined; res(); }))), Promise.resolve())

let VIEWER=null;
function xemAnh(src,el){
  let list=[src];
  if(el){ const box=el.closest('.imgs'); if(box) list=[...box.querySelectorAll('img')].map(i=>i.src); }
  let i=Math.max(0,list.indexOf(src));
  closeViewer(true);
  const d=document.createElement('div'); d.className='viewer';
  d.innerHTML=`<div class="vw-top"><span class="vw-n"></span><button type="button" class="vw-x">✕</button></div>
    <div class="vw-track"></div>
    ${list.length>1?'<button type="button" class="vw-a l">‹</button><button type="button" class="vw-a r">›</button><div class="vw-dots"></div>':''}`;
  const tr=d.querySelector('.vw-track');
  tr.innerHTML=list.map(u=>`<div class="vw-s"><img src="${u}"></div>`).join('');
  const show=(k,anim)=>{ i=(k+list.length)%list.length; tr.style.transition=anim===false?'none':'transform .25s ease'; tr.style.transform=`translateX(${-i*100}%)`; d.querySelector('.vw-n').textContent=list.length>1?`${i+1} / ${list.length}`:''; const dots=d.querySelector('.vw-dots'); if(dots) dots.innerHTML=list.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join(''); };
  let x0=null,y0=null,dx=0;
  tr.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; dx=0; tr.style.transition='none'; },{passive:true});
  tr.addEventListener('touchmove',e=>{ if(x0==null) return; dx=e.touches[0].clientX-x0; const dy=e.touches[0].clientY-y0; if(Math.abs(dx)>Math.abs(dy)) tr.style.transform=`translateX(calc(${-i*100}% + ${dx}px))`; },{passive:true});
  tr.addEventListener('touchend',()=>{ if(x0==null) return; if(dx<-50) show(i+1); else if(dx>50) show(i-1); else show(i); x0=null; });
  d.querySelector('.vw-x').onclick=()=>closeViewer();
  const L=d.querySelector('.vw-a.l'), R=d.querySelector('.vw-a.r');
  if(L) L.onclick=e=>{ e.stopPropagation(); show(i-1); };
  if(R) R.onclick=e=>{ e.stopPropagation(); show(i+1); };
  d.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') show(i-1); if(e.key==='ArrowRight') show(i+1); if(e.key==='Escape') closeViewer(); });
  document.body.appendChild(d); d.tabIndex=-1; d.focus(); VIEWER=d; show(i,false);
  try{ history.pushState({t:tab,viewer:1,sheet:$('#sheet').classList.contains('show')?1:0},''); }catch(e){}
}

function editSaveQuiet(){
  const p = db.phieu.find(x=>x.id===editP.id); if(!p){ editP=null; return; }
  p.ten = editP.ten.trim(); p.sdt = editP.sdt.trim(); p.nv = editP.nv; p.ghichu = editP.ghichu.trim();
  p.items = editP.items.map(i=>({...i})); p.hen = editP.hen || henItems(p.items, dayOf(p.ngayNhan));
  editP=null; save(); render(); toast('Đã tự lưu phiếu '+p.ma);
}
function editSave(){
  const p = db.phieu.find(x=>x.id===editP.id); if(!p) return;
  p.ten = editP.ten.trim(); p.sdt = editP.sdt.trim(); p.nv = editP.nv; p.ghichu = editP.ghichu.trim();
  p.items = editP.items.map(i=>({...i})); p.hen = editP.hen || henItems(p.items, dayOf(p.ngayNhan));
  save(); const id = p.id; editP = null; openPhieu(id); renderList(); toast('Đã lưu');
}
function themTK(){ const t=$('#newTK').value.trim(); if(!t) return; db.taiKhoan.push(t); save(); render(); }
function xoaTK(ix){ ask('Xóa tài khoản này khỏi danh sách?', ()=>{ db.taiKhoan.splice(ix,1); save(); render(); }); }
function themCam(){ const t=$('#newCam').value.trim(); if(!t) return; db.nguoiCam.push(t); save(); render(); }
function xoaCam(ix){ ask('Xóa người này khỏi danh sách cầm tiền?', ()=>{ db.nguoiCam.splice(ix,1); save(); render(); }); }
function saveNH(){
  const ten = $('#nhBank').value, stk = $('#nhStk').value.trim(), chu = $('#nhChu').value.trim();
  if(ten && stk){ db.nganhang = {ten, bin:BANK_BIN[ten], stk, chu}; toast('Đã lưu tài khoản'); }
  else { db.nganhang = null; toast('Đã xóa tài khoản'); }
  save();
}
function ask(text, yes){
  openSheet(`<h2>Xác nhận</h2><p>${esc(text)}</p>
    <div class="row"><button class="primary" style="background:#3a1717;color:#fca5a5" id="askYes">Đồng ý</button>
    <button class="primary" style="background:#262b36" onclick="closeSheet()">Không</button></div>`);
  document.getElementById('askYes').onclick = () => { closeSheet(); yes(); };
}

  const ttTxt = daTra(p) ? `Đã thanh toán đủ: ${fmt(daThu(p))}đ` : daThu(p)>0 ? `Đã trả ${fmt(daThu(p))}đ, còn lại ${fmt(conLai(p))}đ` : 'Chưa thanh toán';
  return `<div class="bill">
    <div class="bc"><img src="${LOGO_SRC}" style="width:150px;display:block;margin:0 auto 6px"><b>SPA ĐỒ HIỆU TỬ TẾ</b><br>CS1: 190 Hà Huy Tập, TP Vinh, Nghệ An<br>CS2: 58 Nguyễn Huệ, P. Cửa Lò, Nghệ An<br>Hotline: 0365197000</div>
    <h1>HÓA ĐƠN</h1>
    <div>Mã phiếu: ${esc(p.ma)}<br>Khách: ${esc(p.ten||'-')}<br>Điện thoại: ${esc(p.sdt||'-')}<br>Ngày: ${new Date(p.ngayNhan).toLocaleString('vi-VN')}<br>Nhận tại: ${esc(CO[p.co])}</div>
    <hr><table class="bt"><tr><th>STT</th><th>Dịch vụ</th><th class="br">Thành tiền</th></tr>
    ${p.items.map((i,ix)=>`<tr><td>${ix+1}</td><td>${esc(i.ten)}</td><td class="br">${fmt(i.gia)}</td></tr>`).join('')}</table>
    <hr><table><tr class="bb"><td>Tổng cộng</td><td class="br">${fmt(tong)}đ</td></tr></table>
    <div>${ttTxt}</div>
    ${qr ? `<div class="bc" style="margin-top:8px">Quét mã để chuyển khoản<img src="${qr}" style="width:200px;display:block;margin:6px auto"><div>${esc(nh.ten)} · ${esc(nh.stk)}<br>${esc(nh.chu)}</div></div>` : ''}
    <hr><div class="bc">Cảm ơn quý khách!<br>Khách đến lấy hàng vui lòng mang theo hóa đơn.<br>Cửa hàng không chịu trách nhiệm nếu để hàng quá 30 ngày kể từ ngày thông báo đã xong hàng.</div>
  </div>`;
}
function noDau(t){ return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D'); }
function crc16(str){ let crc=0xFFFF; for(let i=0;i<str.length;i++){ crc^=str.charCodeAt(i)<<8; for(let j=0;j<8;j++){ crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1); crc&=0xFFFF; } } return crc.toString(16).toUpperCase().padStart(4,'0'); }
function tlv(t,v){ return t + String(v.length).padStart(2,'0') + v; }
function emvPayload(nh, amount, info){
  const nested = tlv('00', nh.bin) + tlv('01', String(nh.stk));
  const mai = tlv('00','A000000727') + tlv('01', nested) + tlv('02','QRIBFTTA');
  let s = tlv('00','01') + tlv('01','12') + tlv('38', mai) + tlv('52','0000') + tlv('53','704');
  if(amount>0) s += tlv('54', String(amount));
  s += tlv('58','VN');
  if(nh.chu) s += tlv('59', noDau(nh.chu).toUpperCase().slice(0,25));
  s += tlv('62', tlv('08', noDau(info).replace(/[^A-Za-z0-9-]/g,'').slice(0,25)));
  s += '6304';
  return s + crc16(s);
}
function qrCanvas(text, size){
  const q = qrcode(0,'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), quiet = 4, cell = size/(n+quiet*2);
  const cv = document.createElement('canvas'); cv.width = size; cv.height = size;
  const g = cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,size,size); g.fillStyle='#000';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) g.fillRect((c+quiet)*cell,(r+quiet)*cell,cell+0.5,cell+0.5);
  return cv;
}
function loadImg(src, cors){ return new Promise(res=>{ const im=new Image(); if(cors) im.crossOrigin='anonymous'; im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; }); }
function toBlobOf(c){ return new Promise((res,rej)=>{ try{ c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png'); }catch(e){ rej(e); } }); }
const NHOM_BH = ['02','04','09'];
function baoHanhHD(p){
  const coBH = p.items.some(i=>{ const d=db.dv.find(x=>x.ten===i.ten); return d && NHOM_BH.includes(d.nhom); });
  return coBH ? ['Bảo hành keo 1 năm khi làm full keo','Fix keo bảo hành 2 tháng'] : [];
}
function qrHoaDon(p){ const nh=db.nganhang; return (!daTra(p) && nh && nh.bin && nh.stk) ? `https://img.vietqr.io/image/${nh.bin}-${nh.stk}-compact2.png?amount=${tongPhieu(p)}&addInfo=${encodeURIComponent(p.ma)}&accountName=${encodeURIComponent(nh.chu||'')}` : ''; }
function drawHD(p, logo, qr){
  const W=640, pad=40, items=p.items, tong=tongPhieu(p), nh=db.nganhang;
  const bh = baoHanhHD(p);
  const logoH = logo ? Math.round(170*logo.height/logo.width) : 0;
  const qrH = qr ? 300 : 0;
  const H = 2400;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,W,H); g.fillStyle='#000';
  let y=30;
  if(logo){ g.drawImage(logo,(W-170)/2,y,170,logoH); y+=logoH+16; }
  const C=(t,yy,f)=>{ g.font=f; g.textAlign='center'; g.fillText(t,W/2,yy); };
  const L=(t,yy,f,mw)=>{ g.font=f; g.textAlign='left'; g.fillText(t,pad,yy,mw); };
  const R=(t,yy,f)=>{ g.font=f; g.textAlign='right'; g.fillText(t,W-pad,yy); };
  C('SPA ĐỒ HIỆU TỬ TẾ',y,'bold 26px Arial'); y+=30;
  C('CS1: 190 Hà Huy Tập, TP Vinh, Nghệ An',y,'18px Arial'); y+=24;
  C('CS2: 58 Nguyễn Huệ, P. Cửa Lò, Nghệ An',y,'18px Arial'); y+=24;
  C('Hotline: 0365197000',y,'18px Arial'); y+=40;
  C('HÓA ĐƠN',y,'bold 30px Arial'); y+=40;
  const colB = pad+330;
  g.font='20px Arial'; g.textAlign='left';
  const tenHD=(p.ten||'').replace(/^[AC]\s+/,''); g.fillText('Khách: '+(tenHD?'A/C '+tenHD:'-'),pad,y,300); g.fillText('SĐT: '+(p.sdt||'-'),colB,y,W-colB-pad); y+=28;
  g.fillText('Mã phiếu: '+p.ma,pad,y); g.fillText('Ngày: '+new Date(p.ngayNhan).toLocaleDateString('vi-VN'),colB,y); y+=28;
  g.fillText('Nhận tại: '+CO[p.co],pad,y); y+=34;
  y+=10;
  const cx=[pad,pad+70,W-pad-200,W-pad], rh=40;
  const rows=[{c:['STT','Dịch vụ','Thành tiền'],b:1}].concat(items.map((i,ix)=>({c:[String(ix+1),i.ten,fmt(i.gia)+'đ']}))).concat([{c:['Tổng cộng','',fmt(tong)+'đ'],b:1,t:1}]);
  const top=y; g.strokeStyle='#000'; g.fillStyle='#000'; g.lineWidth=1.5;
  rows.forEach(r=>{
    g.font = r.b ? 'bold 20px Arial' : '20px Arial';
    r.c.forEach((t,ci)=>{
      if(!t || (r.t && ci===1)) return;
      if(ci===2){ g.textAlign='right'; g.fillText(t,cx[3]-8,y+27); }
      else { g.textAlign='left'; g.fillText(t,cx[ci]+8,y+27,(r.t&&ci===0)?cx[2]-cx[0]-16:cx[ci+1]-cx[ci]-16); }
    });
    g.beginPath(); g.moveTo(pad,y); g.lineTo(W-pad,y); g.stroke();
    y+=rh;
  });
  g.beginPath(); g.moveTo(pad,y); g.lineTo(W-pad,y); g.stroke();
  let yy=top;
  rows.forEach(r=>{ cx.forEach((bx,k)=>{ if(r.t && k===1) return; g.beginPath(); g.moveTo(bx,yy); g.lineTo(bx,yy+rh); g.stroke(); }); yy+=rh; });
  y+=20;
  const tt = daTra(p) ? `Đã thanh toán đủ: ${fmt(daThu(p))}đ` : daThu(p)>0 ? `Đã trả ${fmt(daThu(p))}đ, còn lại ${fmt(conLai(p))}đ` : 'Chưa thanh toán';
  L(tt,y,'20px Arial'); y+=36;
  if(bh.length){ g.fillRect(pad,y,W-2*pad,2); y+=28; g.font='bold 20px Arial'; g.textAlign='left'; g.fillText('Bảo hành',pad,y); y+=28; bh.forEach(t=>{ g.font='19px Arial'; g.textAlign='left'; g.fillText('• '+t,pad,y); y+=28; }); y+=12; }
  if(qr && nh){
    C(daTra(p)?'MÃ QR':'QUÉT MÃ QR ĐỂ THANH TOÁN',y,'bold 22px Arial'); y+=20;
    g.drawImage(qr,(W-300)/2,y,300,300); y+=316;
    C(nh.ten+' · STK '+nh.stk,y,'19px Arial'); y+=26;
    C('Chủ TK: '+(nh.chu||'-'),y,'19px Arial'); y+=26;
    C('Số tiền: '+fmt(tong)+'đ · Nội dung CK: '+p.ma,y,'19px Arial'); y+=34;
  }
  g.fillRect(pad,y,W-2*pad,2); y+=30;
  C('Cảm ơn quý khách!',y,'bold 22px Arial'); y+=30;
  C('Khách đến lấy hàng vui lòng mang theo hóa đơn.',y,'18px Arial'); y+=26;
  C('Cửa hàng không chịu trách nhiệm nếu để hàng quá',y,'18px Arial'); y+=24;
  C('30 ngày kể từ ngày thông báo đã xong hàng.',y,'18px Arial');
  const out=document.createElement('canvas'); out.width=W; out.height=y+40; out.getContext('2d').drawImage(c,0,0); return out;
}
function hoaDonAnh(id){
  const p = db.phieu.find(x=>x.id===id); if(!p) return;
  const so = sdtZalo(p.sdt);
  if(so.length<9 || !(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem)) return hoaDonShare(p);
  const pr = hdBlob(p);
  let ok;
  try{ ok = navigator.clipboard.write([new ClipboardItem({'image/png': pr})]); }catch(e){ ok = Promise.reject(e); }
  toast('Đang tạo hóa đơn...');
  ok.then(()=>zaloBar(so, p.ten, 'Đã chép ảnh hóa đơn. Trong Zalo: ấn giữ ô chat → Dán → Gửi'))

}
function zaloBar(so, ten, msg){
  let b=document.getElementById('zlBar');
  if(!b){ b=document.createElement('div'); b.id='zlBar'; document.body.appendChild(b); }
  b.style.cssText='position:fixed;left:10px;right:10px;bottom:84px;z-index:99;background:#0f172a;border:1px solid #2563eb;border-radius:14px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.6)';

}
function hdSave(p, blob){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hoa-don-'+p.ma+'.png';
  document.body.appendChild(a); a.click(); a.remove();
}
async function hdBlob(p){
  const nh = db.nganhang;
  const logo = await loadImg(LOGO_SRC, false);
  let qr = null;
  if(nh && nh.bin && nh.stk) qr = qrCanvas(emvPayload(nh, tongPhieu(p), p.ma), 520);
  return await toBlobOf(drawHD(p, logo, qr));
}
async function hoaDonShare(p){
  const nh = db.nganhang;
  const logo = await loadImg(LOGO_SRC, false);
  let qr = null;
  if(nh && nh.bin && nh.stk) qr = qrCanvas(emvPayload(nh, tongPhieu(p), p.ma), 520);
  else toast('Chưa cài tài khoản ngân hàng trong Cài đặt: hóa đơn chưa có mã QR');
  const blob = await toBlobOf(drawHD(p, logo, qr));
  const name = 'hoa-don-'+p.ma+'.png';
  const file = new File([blob], name, {type:'image/png'});
  const text = `Hóa đơn ${p.ma} - tổng ${fmt(tongPhieu(p))}đ. ${daTra(p)?'Cảm ơn quý khách.':'Quý khách vui lòng quét mã QR trên hóa đơn để thanh toán. Xin cảm ơn!'}`;
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'Hóa đơn '+p.ma, text}); return; }
    catch(e){ if(e.name==='AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  toast('Đã lưu ảnh hóa đơn');
}

function closeSheet(){ const was=$('#sheet').classList.contains('show'); $('#sheet').classList.remove('show'); if(was && !NAV_POP && history.state && history.state.sheet){ NAV_SKIP=true; history.back(); } }

/* ---------- đồng bộ online ---------- */
function fp(r){ return JSON.stringify(r, (k,v)=> k==='anhs' ? (v||[]).map(a=>a.length+':'+a.slice(-24)) : v); }
function setSyncMsg(t){ const el=$('#co-now'); if(el) el.textContent=t; }
function saveSnap(){ try{ LS.setItem(SNAP_KEY, JSON.stringify(snap)); }catch(e){} }
function allRecs(){
  const out=[];
  db.phieu.forEach(p=>out.push(['phieu', String(p.id), p]));
  db.dv.forEach(d=>out.push(['dv', String(d.id), d]));
  db.nhom.forEach(g=>out.push(['nhom', g.id, g]));
  db.nv.forEach(n=>out.push(['nv', n, {n}]));
  db.taiKhoan.forEach(n=>out.push(['taiKhoan', n, {n}]));
  db.nguoiCam.forEach(n=>out.push(['nguoiCam', n, {n}]));
  Object.entries(db.chamSoc||{}).forEach(([k,v])=>out.push(['chamSoc', k, {v}]));
  if(db.nganhang) out.push(['nganhang', 'nh', db.nganhang]);
  return out;
}
function diffPush(){
  const now = Date.now(), cur = {}, changes = [];
  allRecs().forEach(([t,id,r])=>{ cur[t+'|'+id] = true; const k=t+'|'+id, f=fp(r);
    if(!snap[k] || snap[k].del || snap[k].f!==f){ snap[k]={u:now, f:f}; changes.push({tbl:t, id:id, u:now, rec:r}); } });
  Object.keys(snap).forEach(k=>{
    if(!cur[k] && !snap[k].del){ const i=k.indexOf('|'); const t=k.slice(0,i), id=k.slice(i+1);
      snap[k]={u:now, f:'', del:true}; changes.push({tbl:t, id:id, u:now, del:true}); }
  });
  return changes;
}
function applyPull(recs){
  recs.forEach(x=>{
    const k=x.tbl+'|'+x.id, old=snap[k];
    if(x.tbl==='seq' || (old && old.u>=x.u)) return;
    if(x.tbl==='phieu'){
      const i=db.phieu.findIndex(p=>String(p.id)===x.id);
      if(x.del){ if(i>=0) db.phieu.splice(i,1); }
      else if(i>=0) db.phieu[i]=x.rec; else db.phieu.push(x.rec);
      db.phieu.sort((a,b)=>b.ngayNhan-a.ngayNhan);
    } else if(x.tbl==='dv' || x.tbl==='nhom'){
      const arr = x.tbl==='dv' ? db.dv : db.nhom;
      const i=arr.findIndex(d=>String(d.id)===x.id);
      if(x.del){ if(i>=0) arr.splice(i,1); }
      else if(i>=0) arr[i]=x.rec; else arr.push(x.rec);
    } else if(x.tbl==='nv' || x.tbl==='taiKhoan' || x.tbl==='nguoiCam'){
      const arr = db[x.tbl];
      if(x.del){ const j=arr.indexOf(x.id); if(j>=0) arr.splice(j,1); }
      else if(!arr.includes(x.id)) arr.push(x.id);
    } else if(x.tbl==='chamSoc'){
      if(x.del) delete db.chamSoc[x.id]; else { db.chamSoc=db.chamSoc||{}; db.chamSoc[x.id]=x.rec.v; }
    } else if(x.tbl==='nganhang'){
      db.nganhang = x.del ? null : x.rec;
    }
    snap[k] = {u:x.u, f:x.del ? '' : fp(x.rec), del:!!x.del};
  });
}
async function api(body){
  body.token = LS.getItem(SYNC_TOKEN_KEY) || '';
  const r = await fetch(LS.getItem(SYNC_KEY), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
  return r.json();
}
async function apiPull(){
  const r = await fetch(LS.getItem(SYNC_KEY)+'?token='+encodeURIComponent(LS.getItem(SYNC_TOKEN_KEY)||''));
  return r.json();
}
async function nextMaSync(co){
  if(LS.getItem(SYNC_KEY)){
    try{ const r = await api({action:'seq', co:co}); if(r.ok) return (co==='vinh'?'V':'C')+'-'+String(r.n).padStart(4,'0'); }catch(e){}
  }
  return nextMa(co);
}
function queueSync(){
  if(!LS.getItem(SYNC_KEY)) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(sync, 1500);
}
async function sync(){
  const url = LS.getItem(SYNC_KEY);
  if(!url || syncing) return;
  syncing = true; setSyncMsg('Đang đồng bộ...');
  try{
    // 1. Ảnh mới chụp: gửi lên Drive, đổi thành link
    for(const p of db.phieu){
      if(!(p.anhs||[]).some(a=>a.startsWith('data:'))) continue;
      const out=[];
      for(const a of p.anhs){
        if(a.startsWith('data:')){
          const r = await api({action:'photo', name:'anh-'+p.ma+'-'+Date.now()+'.jpg', data:a});
          out.push(r.ok ? r.url : a);
        } else out.push(a);
      }
      p.anhs = out;
    }
    localSave();
    // 2. Đẩy thay đổi của máy này
    const changes = diffPush();
    for(let i=0;i<changes.length;i+=40){ const r = await api({action:'push', recs:changes.slice(i,i+40)}); if(!r.ok) throw new Error(r.error); }
    // 3. Kéo thay đổi của máy khác
    const g = await apiPull();
    if(!g.ok) throw new Error(g.error);
    applyPull(g.recs);
    localSave(); saveSnap();
    setSyncMsg('Đã đồng bộ '+hm(Date.now()));
    if(!$('#sheet').classList.contains('show')) render();
  }catch(e){
    saveSnap(); setSyncMsg('Lỗi đồng bộ, dữ liệu vẫn lưu trên máy');
    console.error(e);
  }
  finally{ syncing = false; }
}
function saveSync(){
  const u = $('#syUrl').value.trim(), t = $('#syTok').value.trim();
  if(!u){ LS.removeItem(SYNC_KEY); LS.removeItem(SYNC_TOKEN_KEY); LS.setItem(SYNC_OFF,'1'); setSyncMsg(''); toast('Đã tắt đồng bộ'); render(); return; }
  LS.removeItem(SYNC_OFF); LS.setItem(SYNC_KEY, u); LS.setItem(SYNC_TOKEN_KEY, t||DEF_SYNC_TOK);
  toast('Đang đồng bộ...'); sync();
}

['pointerdown','touchstart','keydown'].forEach(ev=>window.addEventListener(ev,navGuard,{capture:true,passive:true}));

if(LS.getItem(SYNC_KEY)) sync();
warmImgs(); setInterval(warmImgs, 6000);
